<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bounce Math Pro: Infinite Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020617;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #020617;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            pointer-events: auto;
        }
        .btn {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            padding: 12px 32px;
            border-radius: 9999px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            color: white;
        }
        .btn:hover { transform: scale(1.05) translateY(-2px); }
        .stop-btn {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            pointer-events: auto;
        }
        .ai-btn { background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%); }
        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255,255,255,0.05);
            min-width: 80px;
        }
        #math-popup {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
            pointer-events: none;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <!-- Dashboard Atas -->
        <div id="stats" class="absolute top-6 flex justify-between w-full px-10 pointer-events-none">
            <div class="flex gap-4">
                <div class="stat-card">
                    <span class="text-slate-400 text-xs uppercase font-bold block">Skor</span>
                    <span id="score-val" class="text-2xl font-black text-blue-400">0</span>
                </div>
                <div class="stat-card">
                    <span class="text-slate-400 text-xs uppercase font-bold block">Betul</span>
                    <span id="math-correct-val" class="text-2xl font-black text-emerald-400">0</span>
                </div>
            </div>
            <div class="flex flex-col items-end gap-2">
                <div class="stat-card">
                    <span class="text-slate-400 text-xs uppercase font-bold block text-right">Mode</span>
                    <span class="text-xl font-black text-amber-400 uppercase">Tanpa Had</span>
                </div>
                <button id="end-session-btn" class="btn stop-btn py-2 px-4 text-xs hidden">Berhenti & Lihat Laporan</button>
            </div>
        </div>

        <div id="math-popup">Selesaikan!</div>

        <!-- Mesej Permulaan -->
        <div id="start-msg" class="flex flex-col items-center gap-6">
            <h1 class="text-5xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 text-center uppercase">Infinite Math Run</h1>
            <p class="text-slate-400 text-center max-w-xs font-medium">Main tanpa henti! Selesaikan sebanyak mungkin soalan untuk melihat had keupayaan otak anda.</p>
            <div class="text-white font-medium animate-pulse">Klik / Sentuh untuk Mula</div>
            <button class="btn ai-btn" id="strategy-btn">✨ Tip Strategi AI</button>
            <div id="strategy-text" class="glass-panel p-4 max-w-sm text-sm hidden text-center italic"></div>
        </div>

        <!-- Skrin Tamat Permainan (Manual) -->
        <div id="game-over-screen" class="glass-panel shadow-2xl hidden p-8">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Analisis Sesi Latihan</h2>
            <h1 class="text-3xl font-black text-white mb-2">SKOR AKHIR: <span id="final-score" class="text-blue-400">0</span></h1>
            
            <div class="grid grid-cols-2 gap-4 my-4">
                <div class="bg-black/20 p-3 rounded-lg">
                    <span class="text-xs text-slate-400 block">Jumlah Soalan</span>
                    <span id="total-math-answered" class="text-xl font-bold">0</span>
                </div>
                <div class="bg-black/20 p-3 rounded-lg">
                    <span class="text-xs text-slate-400 block">Jawapan Tepat</span>
                    <span id="total-math-correct" class="text-xl font-bold text-emerald-400">0</span>
                </div>
            </div>

            <div class="bg-indigo-900/30 p-4 rounded-xl mb-6 border border-indigo-500/30">
                <p id="ai-motivation" class="text-sm italic">Menganalisis kemajuan anda...</p>
            </div>

            <button class="btn w-full" onclick="resetGame()">Mula Sesi Baharu</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const apiKey = ""; 
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-val');
        const mathCorrectEl = document.getElementById('math-correct-val');
        const startMsg = document.getElementById('start-msg');
        const strategyBtn = document.getElementById('strategy-btn');
        const strategyText = document.getElementById('strategy-text');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const aiMotivation = document.getElementById('ai-motivation');
        const mathPopup = document.getElementById('math-popup');
        const endSessionBtn = document.getElementById('end-session-btn');
        
        const statsElTotal = document.getElementById('total-math-answered');
        const statsElCorrect = document.getElementById('total-math-correct');

        let score = 0;
        let mathAnsweredCount = 0;
        let mathCorrectCount = 0;
        let level = 1;
        let gameRunning = false;
        let animationId;
        let shakeTime = 0;
        let particles = [];
        let items = []; 
        let activeMathProblem = null;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const paddle = {
            width: 150,
            height: 14,
            x: 0,
            y: 0,
            color: '#3b82f6',
            targetX: 0,
            lerp: 0.15
        };

        const ball = {
            x: 0, y: 0, radius: 9, speed: 7, dx: 0, dy: 0, color: '#ffffff'
        };

        let bricks = [];
        const brickConfig = { rows: 5, cols: 8, padding: 8, topOffset: 120, sideOffset: 30 };

        class MathItem {
            constructor(x, y, value, isCorrect) {
                this.x = x; this.y = y; this.value = value;
                this.isCorrect = isCorrect;
                this.speed = 3;
                this.radius = 26;
            }
            update() { this.y += this.speed; }
            draw() {
                ctx.fillStyle = this.isCorrect ? "#fbbf24" : "#f59e0b";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#fbbf24";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = "#000";
                ctx.font = "bold 16px Inter";
                ctx.textAlign = "center";
                ctx.fillText(this.value, this.x, this.y + 6);
            }
        }

        function initPositions() {
            paddle.x = canvas.width / 2 - paddle.width / 2;
            paddle.y = canvas.height - 70;
            ball.x = canvas.width / 2;
            ball.y = paddle.y - 30;
            ball.speed = 7 + (level * 0.2); 
            ball.dx = 4;
            ball.dy = -ball.speed;
        }

        function initBricks() {
            const availableWidth = canvas.width - (brickConfig.sideOffset * 2);
            const brickWidth = (availableWidth - (brickConfig.padding * (brickConfig.cols - 1))) / brickConfig.cols;
            bricks = [];
            for(let c=0; c<brickConfig.cols; c++) {
                bricks[c] = [];
                for(let r=0; r<brickConfig.rows; r++) {
                    bricks[c][r] = { 
                        x: 0, y: 0, status: 1, 
                        color: `hsl(${(r * 35) + (level * 40)}, 70%, 55%)`,
                        w: brickWidth, h: 22
                    };
                }
            }
        }

        function generateMathProblem() {
            const a = Math.floor(Math.random() * (10 + level)) + 1;
            const b = Math.floor(Math.random() * (10 + level)) + 1;
            const type = Math.random() > 0.5 ? '+' : '-';
            let correct = type === '+' ? a + b : Math.max(1, a - b);
            
            activeMathProblem = { q: `${Math.max(a,b)} ${type} ${Math.min(a,b)}`, a: correct };
            
            mathPopup.innerText = `${activeMathProblem.q} = ?`;
            mathPopup.style.display = "block";

            const wrong = correct + (Math.random() > 0.5 ? 2 : -2);
            const startX = Math.random() * (canvas.width / 2 - 100) + 50;
            items.push(new MathItem(startX, 80, correct, true));
            items.push(new MathItem(canvas.width - startX, 80, wrong, false));
        }

        async function callGemini(prompt, system) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: system }] }
                    })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Hebat!";
            } catch (err) { return "Teruskan bermain!"; }
        }

        strategyBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            strategyBtn.disabled = true;
            strategyBtn.innerHTML = '⚡ Menganalisis...';
            const res = await callGemini("Beri satu tip pendek cara fokus matematik dalam permainan tanpa had.", "Pakar Fokus.");
            strategyText.innerText = res;
            strategyText.classList.remove('hidden');
            strategyBtn.innerHTML = '✨ Tip Strategi AI';
            strategyBtn.disabled = false;
        });

        function draw() {
            let offsetX = 0, offsetY = 0;
            if(shakeTime > 0) {
                offsetX = (Math.random() - 0.5) * 6;
                offsetY = (Math.random() - 0.5) * 6;
                shakeTime--;
            }

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.clearRect(-10, -10, canvas.width+20, canvas.height+20);

            // Bricks
            let activeBricks = 0;
            bricks.forEach((col, c) => {
                col.forEach((b, r) => {
                    if(b.status === 1) {
                        activeBricks++;
                        b.x = (c * (b.w + brickConfig.padding)) + brickConfig.sideOffset;
                        b.y = (r * (b.h + brickConfig.padding)) + brickConfig.topOffset;
                        ctx.fillStyle = b.color;
                        ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 6); ctx.fill();
                    }
                });
            });

            // Regenerate bricks if all cleared
            if(activeBricks === 0 && gameRunning) {
                level++;
                initBricks();
            }

            // Math Items
            items.forEach((item, index) => {
                item.update();
                item.draw();
                
                // Paddle collision
                if(item.y + item.radius > paddle.y && item.x > paddle.x && item.x < paddle.x + paddle.width) {
                    mathAnsweredCount++;
                    if(item.isCorrect) {
                        mathCorrectCount++;
                        score += 100;
                        mathCorrectEl.innerText = mathCorrectCount;
                        scoreEl.innerText = score;
                        mathPopup.innerText = "TEPAT! +100";
                    } else {
                        score = Math.max(0, score - 50);
                        scoreEl.innerText = score;
                        mathPopup.innerText = "SALAH! -50";
                    }
                    items = [];
                    setTimeout(() => { if(items.length === 0) mathPopup.style.display = "none"; }, 1500);
                }
            });

            // Ball
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();

            // Paddle
            ctx.fillStyle = paddle.color;
            ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8); ctx.fill();

            ctx.restore();

            if(gameRunning) {
                updateLogic();
                animationId = requestAnimationFrame(draw);
            }
        }

        function updateLogic() {
            ball.x += ball.dx; ball.y += ball.dy;
            paddle.x += (paddle.targetX - paddle.x) * paddle.lerp;

            if(ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) ball.dx = -ball.dx;
            if(ball.y - ball.radius < 0) ball.dy = -ball.dy;

            // Bounce on paddle
            if(ball.y + ball.radius > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                let hitPos = (ball.x - (paddle.x + paddle.width/2)) / (paddle.width/2);
                ball.dx = hitPos * ball.speed;
                ball.dy = -ball.speed;
                ball.y = paddle.y - ball.radius;
                shakeTime = 3;
            }

            // Infinite respawn
            if(ball.y > canvas.height) {
                ball.x = canvas.width/2;
                ball.y = canvas.height/2;
                ball.dy = -ball.speed;
                ball.dx = 3;
            }

            bricks.forEach(col => {
                col.forEach(b => {
                    if(b.status === 1) {
                        if(ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            scoreEl.innerText = score;
                            if(Math.random() < 0.2 && items.length === 0) generateMathProblem();
                        }
                    }
                });
            });
        }

        endSessionBtn.addEventListener('click', async () => {
            gameRunning = false;
            endSessionBtn.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScoreEl.innerText = score;
            statsElTotal.innerText = mathAnsweredCount;
            statsElCorrect.innerText = mathCorrectCount;

            const accuracy = mathAnsweredCount > 0 ? Math.round((mathCorrectCount/mathAnsweredCount)*100) : 0;
            const res = await callGemini(
                `Pemain menamatkan sesi tanpa had. Skor: ${score}. Jawapan betul: ${mathCorrectCount}/${mathAnsweredCount}. Ketepatan: ${accuracy}%. Beri laporan kemajuan matematik yang terperinci dan profesional dalam BM.`, 
                "Pakar Analisis Pendidikan."
            );
            aiMotivation.innerText = res;
        });

        window.addEventListener('mousemove', (e) => paddle.targetX = e.clientX - paddle.width/2);
        window.addEventListener('touchmove', (e) => {
            paddle.targetX = e.touches[0].clientX - paddle.width/2;
            e.preventDefault();
        }, {passive: false});

        window.addEventListener('mousedown', () => {
            if(!gameRunning && gameOverScreen.classList.contains('hidden')) {
                gameRunning = true;
                startMsg.classList.add('hidden');
                endSessionBtn.classList.remove('hidden');
                initPositions();
                draw();
            }
        });

        function resetGame() {
            score = 0; mathAnsweredCount = 0; mathCorrectCount = 0; level = 1;
            scoreEl.innerText = 0; mathCorrectEl.innerText = 0;
            gameOverScreen.classList.add('hidden');
            startMsg.classList.remove('hidden');
            strategyText.classList.add('hidden');
            items = [];
            initBricks();
            initPositions();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            draw();
        }

        initBricks();
        initPositions();
        draw();
    </script>
</body>
</html>
